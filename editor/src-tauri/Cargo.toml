[package]
name = "ltop-editor"
version = "0.1.0"
description = "Tauri resource editor for the raylib LttP engine"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
