<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LttP Resource Editor</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 14px -apple-system, "Segoe UI", Helvetica, sans-serif; color: #222; background: #fafafa; }
#root { display: flex; min-height: 100vh; }
nav { width: 170px; flex: none; background: #1e1e28; padding: 12px 10px; }
nav button { display: block; width: 100%; text-align: left; margin: 2px 0; padding: 8px 10px;
  background: none; border: none; color: #aaa; cursor: pointer; font-size: 14px; border-radius: 6px; }
nav button.active { background: #3b3b6a; color: #fff; }
main { flex: 1; padding: 20px 24px; max-width: 1150px; min-width: 0; }
h1 { font-size: 18px; margin: 0 0 14px; }
h2 { font-size: 12px; margin: 18px 0 6px; color: #666; text-transform: uppercase; letter-spacing: .06em; }
button.btn { padding: 6px 14px; border: 1px solid #c5c5c5; background: #fff; border-radius: 6px;
  cursor: pointer; font-size: 13px; }
button.btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
button.btn:disabled { opacity: .45; cursor: default; }
.sidebar { width: 200px; flex: none; border-right: 1px solid #e4e4e4; padding-right: 14px; margin-right: 18px; }
.sidebar button.item { display: block; width: 100%; text-align: left; margin: 2px 0; padding: 6px 8px;
  border: none; background: none; cursor: pointer; border-radius: 6px; font-size: 13px; }
.sidebar button.item.active { background: #dbeafe; }
.layout { display: flex; align-items: flex-start; }
input, select { padding: 5px 7px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; }
input[type=number] { width: 60px; }
input[type=checkbox] { width: auto; }
.field { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.field label { width: 80px; flex: none; color: #555; font-size: 13px; }
canvas { image-rendering: pixelated; background: #777; border: 1px solid #bbb; display: block; }
.row { display: flex; align-items: center; gap: 6px; margin: 4px 0; flex-wrap: wrap; }
pre.build { background: #111; color: #a5d6a7; padding: 12px; border-radius: 8px; max-height: 420px;
  overflow: auto; font-size: 12px; white-space: pre-wrap; margin-top: 12px; }
.dim { color: #999; font-size: 12px; }
.delete { color: #c00; cursor: pointer; border: none; background: none; font-size: 15px; padding: 0 4px; }
.fail { color: #c00; }
.sheet { image-rendering: pixelated; border: 1px solid #ccc; background: #555; max-width: 256px; }
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" src="/app.js"></script>
</body>
</html>
